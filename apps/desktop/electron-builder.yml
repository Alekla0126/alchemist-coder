appId: com.alekla.alchemistcoder
productName: Alchemist Coder
copyright: Copyright © 2026 The Alchemist Code
directories:
  output: release
  buildResources: build
files:
  - out/**
  - package.json
asarUnpack:
  - "**/node_modules/node-pty/**"
npmRebuild: true
protocols:
  - name: Alchemist Coder
    schemes: [alchemistcoder]
mac:
  category: public.app-category.developer-tools
  target:
    - target: dmg
      arch: [arm64, x64]
    - target: zip
      arch: [arm64, x64]
  hardenedRuntime: true
  artifactName: Alchemist-Coder-${version}-${arch}.${ext}
  # Signing and notarization need an Apple Developer ID; community builds are unsigned.
  identity: null
dmg:
  title: Alchemist Coder ${version}
win:
  target: [nsis]
  artifactName: Alchemist-Coder-${version}-setup.${ext}
nsis:
  oneClick: false
  allowToChangeInstallationDirectory: true
linux:
  executableName: alchemist-coder
  artifactName: Alchemist-Coder-${version}-${arch}.${ext}
  syncDesktopName: true
  target: [AppImage, deb]
  category: Development
  maintainer: The Alchemist Code
deb:
  # Debian package names are lowercase, without spaces.
  packageName: alchemist-coder
