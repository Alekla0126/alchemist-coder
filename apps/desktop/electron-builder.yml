appId: com.alekla.alchemistcoder
productName: Alchemist Coder
copyright: Copyright © 2026 The Alchemist Code
directories:
  output: release
  buildResources: build
files:
  - out/**
  - package.json
asarUnpack:
  - "**/node_modules/node-pty/**"
npmRebuild: true
protocols:
  - name: Alchemist Coder
    schemes: [alchemistcoder]
mac:
  category: public.app-category.developer-tools
  target:
    - target: dmg
      arch: [arm64, x64]
    - target: zip
      arch: [arm64, x64]
  hardenedRuntime: true
  artifactName: Alchemist-Coder-${version}-${arch}.${ext}
  # Notarization needs an Apple Developer ID. Without one, community builds are signed ad hoc ("-"):
  # unsigned, a downloaded app's broken signature makes macOS call it "damaged". The default
  # entitlements include disable-library-validation, which ad hoc signing with hardenedRuntime needs.
  identity: "-"
dmg:
  title: Alchemist Coder ${version}
win:
  target: [nsis]
  artifactName: Alchemist-Coder-${version}-setup.${ext}
nsis:
  oneClick: false
  allowToChangeInstallationDirectory: true
linux:
  executableName: alchemist-coder
  artifactName: Alchemist-Coder-${version}-${arch}.${ext}
  syncDesktopName: true
  target: [AppImage, deb]
  category: Development
  maintainer: The Alchemist Code
deb:
  # Debian package names are lowercase, without spaces.
  packageName: alchemist-coder
  # electron-builder's defaults, plus ALSA: Electron won't start without it, and minimal installs
  # don't have it (Ubuntu 24.04 renamed it libasound2t64).
  depends: [libgtk-3-0, libnotify4, libnss3, libxss1, libxtst6, xdg-utils, libatspi2.0-0, libuuid1, libsecret-1-0, "libasound2t64 | libasound2"]
  fpm: ["--category", "devel"]
# Built on its own (`electron-builder --linux snap`, see the Snap workflow), not with every release yet.
snap:
  base: core22
  # Classic: like any installed program, it runs your CLIs, git and terminals. The Snap Store
  # approves classic confinement for developer tools on request.
  confinement: classic
  grade: stable
  summary: Desktop app for your coding agents. Claude Code, Codex, Gemini CLI
toolsets:
  # The static AppImage runtime: the legacy one needs libfuse2, which Ubuntu 22.04 and later don't install.
  appimage: "1.0.3"
