name: winget

# Validates a version's winget manifest and installs Alchemist Coder from it on Windows, the way
# `winget install` will once Microsoft accepts it. Run it before submitting the manifest:
#   gh workflow run winget.yml -f version=1.0.0
on:
  workflow_dispatch:
    inputs:
      version:
        description: A version under packaging/winget
        required: true

permissions:
  contents: read

jobs:
  winget:
    runs-on: windows-latest
    timeout-minutes: 20
    steps:
      - uses: actions/checkout@v4
      - name: Get winget if this runner lacks it
        shell: pwsh
        run: |
          if (-not (Get-Command winget -ErrorAction SilentlyContinue)) {
            Install-PackageProvider -Name NuGet -Force | Out-Null
            Install-Module -Name Microsoft.WinGet.Client -Force -Repository PSGallery | Out-Null
            Repair-WinGetPackageManager -AllUsers -Latest
          }
      - name: Validate the manifest, install from it, and check the uninstall entry
        shell: pwsh
        run: |
          $dir = "packaging/winget/TheAlchemistCode.AlchemistCoder/${{ inputs.version }}"
          winget --version
          winget validate --manifest $dir
          if ($LASTEXITCODE -ne 0) { exit 1 }
          winget settings --enable LocalManifestFiles
          # winget marks the download as from the internet, and Windows holds an unsigned .exe with that
          # mark at a security warning nobody can click on a runner (on a PC, you click Run). Here only,
          # .exe counts as low risk so the install can go on.
          $assoc = 'HKCU:\Software\Microsoft\Windows\CurrentVersion\Policies\Associations'
          New-Item -Path $assoc -Force | Out-Null
          New-ItemProperty -Path $assoc -Name LowRiskFileTypes -Value '.exe' -PropertyType String -Force | Out-Null
          # A silent install takes seconds: one that hangs fails here instead of holding the runner.
          $install = Start-Process winget -ArgumentList @('install', '--manifest', $dir, '--accept-package-agreements', '--accept-source-agreements', '--silent', '--disable-interactivity') -NoNewWindow -PassThru
          if (-not $install.WaitForExit(300000)) {
            # What's still running, and what winget logged, before giving up.
            Get-CimInstance Win32_Process | Where-Object { $_.Name -match 'setup|Alchemist|winget|Uninstall' } | Format-Table ProcessId, ParentProcessId, Name, CommandLine -AutoSize -Wrap | Out-String -Width 400
            Get-ChildItem "$env:LOCALAPPDATA\Packages\Microsoft.DesktopAppInstaller_8wekyb3d8bbwe\LocalState\DiagOutputDir" -Filter *.log -ErrorAction SilentlyContinue | Sort-Object LastWriteTime | Select-Object -Last 1 | Get-Content -Tail 40
            Stop-Process -Id $install.Id -Force
            Write-Error 'winget install took more than 5 minutes'; exit 1
          }
          if ($install.ExitCode -ne 0) { Write-Error "winget install failed ($($install.ExitCode))"; exit 1 }
          $exe = Get-ChildItem "$env:LOCALAPPDATA\Programs" -Recurse -Filter 'Alchemist Coder.exe' -ErrorAction SilentlyContinue | Select-Object -First 1
          if (-not $exe) { Write-Error 'The app was not installed'; exit 1 }
          Write-Output "Installed at $($exe.FullName)"
          # winget finds an installed package by the ProductCode: the installer's uninstall key.
          $code = (Select-String -Path "$dir/*.installer.yaml" -Pattern '^ProductCode: (.+)$').Matches[0].Groups[1].Value
          $entry = Get-ChildItem 'HKCU:\Software\Microsoft\Windows\CurrentVersion\Uninstall' | Where-Object { (Get-ItemProperty $_.PSPath).DisplayName -like 'Alchemist Coder*' } | Select-Object -First 1
          Write-Output "Uninstall key: $($entry.PSChildName) (manifest: $code)"
          if (-not $entry -or $entry.PSChildName.Trim('{}') -ne $code) { Write-Error 'The ProductCode does not match the uninstall key'; exit 1 }
