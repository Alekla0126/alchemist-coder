name: Package

# Builds the macOS, Linux and Windows installers, opens each packaged app on a real machine and
# takes screenshots of it. A version tag (v1.2.3) also gathers the installers into a draft GitHub
# release, to publish once the screenshots look right. Without a tag, run it from the Actions tab or
#   gh workflow run package.yml -f ref=main
on:
  push:
    tags: ['v*']
  workflow_dispatch:
    inputs:
      ref:
        description: Branch, tag or commit to build
        default: main

permissions:
  contents: read

jobs:
  package:
    name: package (${{ matrix.os }})
    runs-on: ${{ matrix.os }}
    strategy:
      fail-fast: false
      matrix:
        os: [macos-latest, ubuntu-22.04, windows-latest]
    steps:
      - uses: actions/checkout@v4
        with:
          ref: ${{ inputs.ref || github.ref }}
      - uses: pnpm/action-setup@v4
        with:
          version: 8.15.9
      - uses: actions/setup-node@v4
        with:
          node-version: 24
          cache: pnpm
      - run: pnpm install --frozen-lockfile
      - name: Package
        working-directory: apps/desktop
        shell: bash
        run: |
          case "$RUNNER_OS" in
            macOS) pnpm package:mac ;;
            Linux) pnpm package:linux ;;
            Windows) pnpm package:win ;;
          esac

      - name: Smoke test (install it as a user would, open it and take screenshots)
        shell: bash
        run: |
          set -uo pipefail
          mkdir -p smoke
          FAILED=0
          REL="$PWD/apps/desktop/release"
          # The installers themselves, not the unpacked app: the DMG's app copied out of it, the
          # Windows setup run silently, the .deb through apt (which checks its dependencies).
          case "$RUNNER_OS" in
            macOS)
              hdiutil attach -nobrowse -readonly -mountpoint "$RUNNER_TEMP/dmg" "$REL"/*-arm64.dmg >/dev/null
              ditto "$RUNNER_TEMP/dmg/Alchemist Coder.app" "$RUNNER_TEMP/Applications/Alchemist Coder.app"
              hdiutil detach "$RUNNER_TEMP/dmg" >/dev/null
              # Unsigned or half-signed, a downloaded app is "damaged" for macOS: the signature must hold.
              codesign --verify --deep --strict "$RUNNER_TEMP/Applications/Alchemist Coder.app" > smoke/codesign.log 2>&1 \
                && echo "ok codesign" || { echo "::error::the app's signature doesn't verify"; cat smoke/codesign.log; FAILED=1; }
              APP=("$RUNNER_TEMP/Applications/Alchemist Coder.app/Contents/MacOS/Alchemist Coder")
              WS="$PWD"; OUT="$PWD/smoke"; PROFILES="$RUNNER_TEMP"; SEP=/ ;;
            Linux)
              sudo apt-get update -qq && sudo apt-get install -y -qq xvfb "$(ls "$REL"/*.deb)" > smoke/apt.log 2>&1 \
                && echo "ok apt install" || { echo "::error::the .deb didn't install"; cat smoke/apt.log; FAILED=1; }
              APP=(xvfb-run -a -s "-screen 0 1600x1000x24" /usr/bin/alchemist-coder --no-sandbox)
              WS="$PWD"; OUT="$PWD/smoke"; PROFILES="$RUNNER_TEMP"; SEP=/ ;;
            Windows)
              powershell -NoProfile -Command "Start-Process -FilePath '$(cygpath -w "$(ls "$REL"/*-setup.exe)")' -ArgumentList '/S' -Wait"
              EXE="$(find "$(cygpath -u "$LOCALAPPDATA")/Programs" -maxdepth 2 -name 'Alchemist Coder.exe' | head -1)"
              if [ -n "$EXE" ]; then echo "ok installed at $EXE"; ls "$(dirname "$EXE")" | grep -i uninstall || { echo "::error::no uninstaller"; FAILED=1; }
              else echo "::error::the setup didn't install the app"; FAILED=1; fi
              APP=("$EXE")
              WS="$(cygpath -w "$PWD")"; OUT="$(cygpath -w "$PWD/smoke")"; PROFILES="$(cygpath -w "$RUNNER_TEMP")"; SEP='\' ;;
          esac

          # One short Claude Code conversation in this folder, so the app has a project to open.
          SESSION=cccccccc-3333-4333-8333-cccccccccccc
          WS="$WS" SESSION="$SESSION" node --input-type=module -e '
            import { mkdirSync, writeFileSync } from "node:fs";
            import { homedir } from "node:os";
            import { join } from "node:path";
            const cwd = process.env.WS, sessionId = process.env.SESSION, t = Date.now();
            const base = { sessionId, cwd, gitBranch: "main", version: "2.1.257" };
            const at = (s) => new Date(t - s * 1000).toISOString();
            const records = [
              { ...base, type: "user", uuid: "u1", timestamp: at(90), message: { role: "user", content: "Check that the packaged app opens" } },
              { ...base, type: "assistant", uuid: "a1", parentUuid: "u1", timestamp: at(80), message: { id: "m1", model: "claude-sonnet-5", stop_reason: "end_turn", usage: { input_tokens: 1200, output_tokens: 300 }, content: [{ type: "text", text: "It opens: history, editor and terminal all load." }] } },
              { type: "ai-title", aiTitle: "Packaged app smoke test", sessionId },
            ];
            const dir = join(homedir(), ".claude", "projects", cwd.replace(/[^A-Za-z0-9]/g, "-"));
            mkdirSync(dir, { recursive: true });
            writeFileSync(join(dir, sessionId + ".jsonl"), records.map((r) => JSON.stringify(r)).join("\n") + "\n");
          '

          PROJECT="$(basename "$PWD")"
          # macOS runners have no `timeout`: perl's alarm does the same.
          limit() { if command -v timeout >/dev/null; then timeout 180 "$@"; else perl -e 'alarm shift; exec @ARGV' 180 "$@"; fi; }
          # Each screenshot gets its own profile: on Windows a closing app can still hold the last one's index.
          cap() {
            local name=$1; shift
            limit "${APP[@]}" --capture="$OUT$SEP$name.png" --profile="$PROFILES${SEP}ac-$name" "$@" > "smoke/$name.log" 2>&1 || true
            if [ -f "smoke/$name.png" ]; then echo "ok $name"; else echo "::error::no screenshot for $name"; cat "smoke/$name.log"; FAILED=1; fi
          }
          cap start
          cap session --select="$SESSION:main"
          cap code --project="$PROJECT" --mode=code --open-file="$WS${SEP}README.md"
          cap terminal --project="$PROJECT" --mode=terminal
          cap settings --settings=about
          cap shortcuts --settings=shortcuts
          if [ "$RUNNER_OS" = Linux ]; then
            # The AppImage too, as downloaded: it must open without extra packages.
            cp "$REL"/*.AppImage "$RUNNER_TEMP/ac.AppImage" && chmod +x "$RUNNER_TEMP/ac.AppImage"
            APP=(xvfb-run -a -s "-screen 0 1600x1000x24" "$RUNNER_TEMP/ac.AppImage" --no-sandbox)
            cap appimage
          fi
          exit $FAILED

      - uses: actions/upload-artifact@v4
        if: always()
        with:
          name: smoke-${{ runner.os }}
          path: smoke/
      - uses: actions/upload-artifact@v4
        with:
          name: installers-${{ runner.os }}
          if-no-files-found: error
          path: |
            apps/desktop/release/*.dmg
            apps/desktop/release/*.zip
            apps/desktop/release/*.AppImage
            apps/desktop/release/*.deb
            apps/desktop/release/*.exe

  release:
    name: draft release
    needs: package
    if: startsWith(github.ref, 'refs/tags/v')
    runs-on: ubuntu-latest
    permissions:
      contents: write
    steps:
      - uses: actions/download-artifact@v4
        with:
          pattern: installers-*
          path: dist
          merge-multiple: true
      - name: Draft the release with every installer and their checksums
        env:
          GH_TOKEN: ${{ secrets.GITHUB_TOKEN }}
          TAG: ${{ github.ref_name }}
        run: |
          cd dist
          v="${TAG#v}"
          ls -la
          sha256sum * > SHA256SUMS
          # A suffix (v1.1.0-beta.1) makes a pre-release; a plain version is a release.
          case "$v" in *-*) pre=(--prerelease) ;; *) pre=() ;; esac
          gh release create "$TAG" -R "$GITHUB_REPOSITORY" --draft "${pre[@]}" --title "Alchemist Coder $v" --notes "Installers for macOS, Windows and Linux. SHA256SUMS lists the checksums." *
