name: Package

# Builds the macOS, Linux and Windows installers, opens each packaged app on a real machine and
# takes screenshots of it. A version tag (v1.2.3) also gathers the installers into a draft GitHub
# release, to publish once the screenshots look right. Without a tag, run it from the Actions tab or
#   gh workflow run package.yml -f ref=main
on:
  push:
    tags: ['v*']
  workflow_dispatch:
    inputs:
      ref:
        description: Branch, tag or commit to build
        default: main

permissions:
  contents: read

jobs:
  package:
    name: package (${{ matrix.os }})
    runs-on: ${{ matrix.os }}
    strategy:
      fail-fast: false
      matrix:
        os: [macos-latest, ubuntu-22.04, windows-latest]
    steps:
      - uses: actions/checkout@v4
        with:
          ref: ${{ inputs.ref || github.ref }}
      - uses: pnpm/action-setup@v4
        with:
          version: 8.15.9
      - uses: actions/setup-node@v4
        with:
          node-version: 24
          cache: pnpm
      - run: pnpm install --frozen-lockfile
      - name: Package
        working-directory: apps/desktop
        shell: bash
        run: |
          case "$RUNNER_OS" in
            macOS) pnpm package:mac ;;
            Linux) pnpm package:linux ;;
            Windows) pnpm package:win ;;
          esac

      - name: Smoke test (open the packaged app and take screenshots)
        shell: bash
        run: |
          set -uo pipefail
          case "$RUNNER_OS" in
            macOS)
              APP=("$PWD/apps/desktop/release/mac-arm64/Alchemist Coder.app/Contents/MacOS/Alchemist Coder")
              WS="$PWD"; OUT="$PWD/smoke"; PROFILES="$RUNNER_TEMP"; SEP=/ ;;
            Linux)
              sudo apt-get update -qq && sudo apt-get install -y -qq xvfb >/dev/null
              APP=(xvfb-run -a -s "-screen 0 1600x1000x24" "$PWD/apps/desktop/release/linux-unpacked/alchemist-coder" --no-sandbox)
              WS="$PWD"; OUT="$PWD/smoke"; PROFILES="$RUNNER_TEMP"; SEP=/ ;;
            Windows)
              APP=("$PWD/apps/desktop/release/win-unpacked/Alchemist Coder.exe")
              WS="$(cygpath -w "$PWD")"; OUT="$(cygpath -w "$PWD/smoke")"; PROFILES="$(cygpath -w "$RUNNER_TEMP")"; SEP='\' ;;
          esac
          mkdir -p smoke

          # One short Claude Code conversation in this folder, so the app has a project to open.
          SESSION=cccccccc-3333-4333-8333-cccccccccccc
          WS="$WS" SESSION="$SESSION" node --input-type=module -e '
            import { mkdirSync, writeFileSync } from "node:fs";
            import { homedir } from "node:os";
            import { join } from "node:path";
            const cwd = process.env.WS, sessionId = process.env.SESSION, t = Date.now();
            const base = { sessionId, cwd, gitBranch: "main", version: "2.1.257" };
            const at = (s) => new Date(t - s * 1000).toISOString();
            const records = [
              { ...base, type: "user", uuid: "u1", timestamp: at(90), message: { role: "user", content: "Check that the packaged app opens" } },
              { ...base, type: "assistant", uuid: "a1", parentUuid: "u1", timestamp: at(80), message: { id: "m1", model: "claude-sonnet-5", stop_reason: "end_turn", usage: { input_tokens: 1200, output_tokens: 300 }, content: [{ type: "text", text: "It opens: history, editor and terminal all load." }] } },
              { type: "ai-title", aiTitle: "Packaged app smoke test", sessionId },
            ];
            const dir = join(homedir(), ".claude", "projects", cwd.replace(/[^A-Za-z0-9]/g, "-"));
            mkdirSync(dir, { recursive: true });
            writeFileSync(join(dir, sessionId + ".jsonl"), records.map((r) => JSON.stringify(r)).join("\n") + "\n");
          '

          PROJECT="$(basename "$PWD")"
          FAILED=0
          # macOS runners have no `timeout`: perl's alarm does the same.
          limit() { if command -v timeout >/dev/null; then timeout 180 "$@"; else perl -e 'alarm shift; exec @ARGV' 180 "$@"; fi; }
          # Each screenshot gets its own profile: on Windows a closing app can still hold the last one's index.
          cap() {
            local name=$1; shift
            limit "${APP[@]}" --capture="$OUT$SEP$name.png" --profile="$PROFILES${SEP}ac-$name" "$@" > "smoke/$name.log" 2>&1 || true
            if [ -f "smoke/$name.png" ]; then echo "ok $name"; else echo "::error::no screenshot for $name"; cat "smoke/$name.log"; FAILED=1; fi
          }
          cap start
          cap session --select="$SESSION:main"
          cap code --project="$PROJECT" --mode=code --open-file="$WS${SEP}README.md"
          cap terminal --project="$PROJECT" --mode=terminal
          cap settings --settings=about
          cap shortcuts --settings=shortcuts
          exit $FAILED

      - uses: actions/upload-artifact@v4
        if: always()
        with:
          name: smoke-${{ runner.os }}
          path: smoke/
      - uses: actions/upload-artifact@v4
        with:
          name: installers-${{ runner.os }}
          if-no-files-found: error
          path: |
            apps/desktop/release/*.dmg
            apps/desktop/release/*.zip
            apps/desktop/release/*.AppImage
            apps/desktop/release/*.deb
            apps/desktop/release/*.exe

  release:
    name: draft release
    needs: package
    if: startsWith(github.ref, 'refs/tags/v')
    runs-on: ubuntu-latest
    permissions:
      contents: write
    steps:
      - uses: actions/download-artifact@v4
        with:
          pattern: installers-*
          path: dist
          merge-multiple: true
      - name: Draft the release with every installer and their checksums
        env:
          GH_TOKEN: ${{ secrets.GITHUB_TOKEN }}
          TAG: ${{ github.ref_name }}
        run: |
          cd dist
          v="${TAG#v}"
          ls -la
          sha256sum * > SHA256SUMS
          gh release create "$TAG" -R "$GITHUB_REPOSITORY" --draft --prerelease --title "Alchemist Coder $v (beta)" --notes "Installers for macOS, Windows and Linux. SHA256SUMS lists the checksums." *
